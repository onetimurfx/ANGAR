name: Deploy Supabase backend (manual)

# Manual only. Applies supabase/migrations and deploys the Edge Functions to YOUR Supabase project.
# Needs these repository SECRETS (Settings > Secrets and variables > Actions > Secrets):
#   SUPABASE_ACCESS_TOKEN  (Supabase dashboard > Account > Access Tokens)
#   SUPABASE_PROJECT_REF   (Project settings > General > Reference ID)
#   SUPABASE_DB_PASSWORD   (the database password chosen when the project was created)
# Runtime secrets (BOT_TOKEN, SESSION_SECRET, CRON_SECRET, ALLOWED_ORIGINS) are set in Supabase, not here:
#   see docs/BACKEND_SETUP.md. This workflow has not been run against a real project yet.
on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      # Pinned version (no "latest" lookup, which is what returned HTTP 504) + up to 3 install attempts.
      - name: Install Supabase CLI (attempt 1)
        id: cli1
        uses: supabase/setup-cli@v1
        continue-on-error: true
        with:
          version: 2.122.1
      - name: Wait before retry
        if: steps.cli1.outcome == 'failure'
        run: sleep 30
      - name: Install Supabase CLI (attempt 2)
        id: cli2
        if: steps.cli1.outcome == 'failure'
        uses: supabase/setup-cli@v1
        continue-on-error: true
        with:
          version: 2.122.1
      - name: Install Supabase CLI (attempt 3, npm fallback)
        if: steps.cli1.outcome == 'failure' && steps.cli2.outcome == 'failure'
        run: |
          for i in 1 2 3; do npm install --global supabase@2.122.1 && break; echo "retry $i"; sleep 20; done
      - name: Check CLI
        run: supabase --version
      # GitHub runners have IPv4 only, but the direct database host (db.<ref>.supabase.co) is IPv6-only.
      # `supabase link` (CLI >= 1.136.3, needs SUPABASE_ACCESS_TOKEN) stores the IPv4-capable pooler address in
      # supabase/.temp/pooler-url, and `db push --linked` then connects through it. The DB password is read from
      # the SUPABASE_DB_PASSWORD env var (never passed on the command line, never printed).
      - name: Link project (IPv4 pooler)
        env:
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
        run: |
          for i in 1 2 3; do
            supabase link --project-ref "$SUPABASE_PROJECT_REF" && break
            [ "$i" = 3 ] && exit 1
            echo "link failed, retry $i"; sleep 15
          done
      - name: Check the IPv4 pooler is configured
        run: |
          if [ ! -s supabase/.temp/pooler-url ]; then
            echo "::error::supabase link did not store a pooler URL, so the database cannot be reached over IPv4. Check SUPABASE_ACCESS_TOKEN / SUPABASE_PROJECT_REF."
            exit 1
          fi
          # print the host only; the user part is dropped on purpose
          echo "pooler host: $(sed -E 's#^[a-z]+://[^@]*@##; s#/.*$##' supabase/.temp/pooler-url)"
      - name: Apply migrations
        run: supabase db push --linked
      - name: Deploy Edge Functions
        run: supabase functions deploy --no-verify-jwt
